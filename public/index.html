<!DOCTYPE html>
<html>
<head>
    <title>Kineflex Uploader</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 400px; text-align: center; border: 1px solid #333; }
        input { margin: 20px 0; display: block; width: 100%; color: #ccc; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2563eb; }
        #result { margin-top: 20px; word-wrap: break-word; font-size: 14px; }
        a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Upload to Novabox</h3>
        <input type="file" id="fileInput">
        <button onclick="handleUpload()">Upload Now</button>
        <div id="result"></div>
    </div>

    <script>
        async function handleUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files[0]) return alert("Select a file first");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultDiv.innerHTML = "Processing upload...";

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `Success! Link:<br><a href="${data.link}" target="_blank">${data.link}</a>`;
                } else {
                    resultDiv.innerHTML = "Error: " + data.error;
                }
            } catch (err) {
                resultDiv.innerHTML = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
