<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fast Video Proxy</title>
  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:40px;
    }

    input{
      width:80%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-bottom:20px;
    }

    button{
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#00aaff;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    video{
      width:90%;
      margin-top:30px;
      border-radius:15px;
    }
  </style>
</head>
<body>

<h1>Video Proxy Stream</h1>

<input id="url" placeholder="Paste Catbox MP4 URL">

<br>

<button onclick="playVideo()">Play</button>

<br>

<video id="video" controls></video>

<script>
function playVideo(){
    const url = document.getElementById("url").value;

    document.getElementById("video").src =
        "http://localhost:3000/proxy?url=" +
        encodeURIComponent(url);
}
</script>

</body>
</html>
