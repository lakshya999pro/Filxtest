<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kineflex Cloud Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #link { margin-top: 20px; word-break: break-all; color: blue; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Upload to Kineflex Storage</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload Now</button>
        <div id="status"></div>
        <div id="link"></div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const linkDiv = document.getElementById('link');

            if (fileInput.files.length === 0) return alert("Select a file");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            status.innerText = "Uploading...";
            linkDiv.innerHTML = "";

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    status.innerText = "Upload Successful!";
                    linkDiv.innerHTML = `<a href="${data.downloadLink}" target="_blank">${data.downloadLink}</a>`;
                } else {
                    status.innerText = "Error: " + data.error;
                }
            } catch (err) {
                status.innerText = "Upload failed.";
            }
        }
    </script>
</body>
</html>
