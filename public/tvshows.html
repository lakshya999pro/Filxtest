<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Shows - StreamFlix</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🎬 StreamFlix</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/movies">Movies</a></li>
                <li><a href="/tvshows" class="active">TV Shows</a></li>
            </ul>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search...">
                <button id="searchBtn">🔍</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="content-section">
            <h1>All TV Shows</h1>
            <div id="tvShowsGrid" class="content-grid loading">
                <div class="loader"></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </div>

    <div id="searchResults" class="search-results" style="display: none;">
        <div class="container">
            <div class="search-header">
                <h2>Search Results</h2>
                <button id="closeSearch">✕</button>
            </div>
            <div id="resultsGrid" class="content-grid"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 StreamFlix. All rights reserved.</p>
        </div>
    </footer>

    <script src="/script.js"></script>
    <script>
        let currentPage = 1;
        const limit = 20;

        async function loadTVShows(page = 1) {
            const grid = document.getElementById('tvShowsGrid');
            grid.classList.add('loading');
            grid.innerHTML = '<div class="loader"></div>';

            try {
                const response = await fetch(`/api/tvshows?page=${page}&limit=${limit}`);
                const data = await response.json();

                grid.classList.remove('loading');
                grid.innerHTML = '';

                if (data.success && data.tvShows.length > 0) {
                    data.tvShows.forEach(show => {
                        const card = createCard(show, 'tv');
                        grid.appendChild(card);
                    });

                    renderPagination(data.page, data.totalPages);
                } else {
                    grid.innerHTML = '<p class="no-content">No TV shows available</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                grid.classList.remove('loading');
                grid.innerHTML = '<p class="error">Failed to load TV shows</p>';
            }
        }

        function renderPagination(page, totalPages) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // Previous button
            if (page > 1) {
                const prev = document.createElement('button');
                prev.textContent = '← Previous';
                prev.onclick = () => {
                    currentPage--;
                    loadTVShows(currentPage);
                    window.scrollTo(0, 0);
                };
                pagination.appendChild(prev);
            }

            // Page numbers
            const pageInfo = document.createElement('span');
            pageInfo.textContent = `Page ${page} of ${totalPages}`;
            pageInfo.className = 'page-info';
            pagination.appendChild(pageInfo);

            // Next button
            if (page < totalPages) {
                const next = document.createElement('button');
                next.textContent = 'Next →';
                next.onclick = () => {
                    currentPage++;
                    loadTVShows(currentPage);
                    window.scrollTo(0, 0);
                };
                pagination.appendChild(next);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTVShows(currentPage);
        });
    </script>
</body>
</html>
